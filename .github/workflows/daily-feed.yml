name: Daily feed and Pages deploy

on:
  workflow_dispatch:
  schedule:
    # Update every day at 07:40 Europe/Rome in both CET and CEST windows.
    - cron: '40 5 * * *'
    - cron: '40 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update daily feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run update:feed

      - name: Update daily fable library
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run update:fable

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-feed.json src/data/daily-fables.json src/data/daily-fable-history.json
          git diff --cached --quiet || git commit -m "chore: update daily feed"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build app
        env:
          VITE_BASE_PATH: /jianwen-daily-brief/
          VITE_PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          node scripts/check-mobile-runtime.mjs
          npx tsc
          npx vite build --base /jianwen-daily-brief/
          node scripts/prepare-sites-build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send iPhone notification
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            weekday=$(TZ=Europe/Rome date +%u)
            hour=$(TZ=Europe/Rome date +%H)
            if [ "$weekday" -gt 5 ] || [ "$hour" != "07" ]; then
              echo "Daily content updated; skipping iPhone notification outside Monday-Friday 07:40 Europe/Rome."
              exit 0
            fi
          fi
          if [ -z "$PUSH_API_URL" ] || [ -z "$PUSH_CRON_SECRET" ]; then
            echo "Push server is not configured; skipping notification."
            exit 0
          fi
          curl --fail-with-body --request POST "$PUSH_API_URL/send-daily" \
            --header "content-type: application/json" \
            --header "x-cron-secret: $PUSH_CRON_SECRET" \
            --data "{\"title\":\"见闻 · 今日 15 条精选\",\"body\":\"日报已经准备好，打开查看今天的来源与项目线索。\",\"url\":\"${PAGE_URL:-/}\"}"
